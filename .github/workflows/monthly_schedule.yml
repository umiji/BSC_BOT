name: Monthly Schedule - 調整さん投稿

on:
  push:
    branches:
      - feature/github-actions-migration
  schedule:
    # 毎月1日 09:00 JST (= 00:00 UTC)
    - cron: '0 0 1 * *'
  workflow_dispatch: # 手動実行・テスト用

jobs:
  create-schedule:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install selenium

      - name: Run chouseisan bot & post to GAS
        env:
          GAS_WEBHOOK_URL: ${{ secrets.GAS_WEBHOOK_URL }}
        run: python chouseisan_bot.py
