name: Reminder Schedule - 調整さんリマインド

on:
  schedule:
    # 毎月25日 09:00 JST (= 00:00 UTC)
    - cron: '0 0 25 * *'
  workflow_dispatch: # 手動実行・テスト用

jobs:
  remind-schedule:
    runs-on: ubuntu-latest

    steps:
      - name: Send Remind Trigger to GAS
        env:
          GAS_WEBHOOK_URL: ${{ secrets.GAS_WEBHOOK_URL }}
        run: |
          curl -X POST -H "Content-Type: application/json" \
          -d '{"type": "github_actions_remind"}' \
          $GAS_WEBHOOK_URL
