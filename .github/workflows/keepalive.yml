name: Keepalive - スケジュール自動無効化の防止

# GitHubはパブリックリポジトリで60日間リポジトリ活動がないと
# schedule(cron)ワークフローを自動的に無効化する。
# 月1回の空コミットで活動タイマーをリセットし、無効化を防ぐ。
on:
  schedule:
    # 毎月1日 00:00 UTC (= 09:00 JST)。60日制限に対して2倍の余裕を持たせる
    - cron: '0 0 1 * *'
  workflow_dispatch: # 手動実行・テスト用

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Push empty commit to reset the 60-day inactivity timer
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keepalive - reset scheduled workflow inactivity timer"
          git push origin HEAD:${GITHUB_REF_NAME}
